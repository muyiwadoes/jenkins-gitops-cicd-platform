apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: wanderlust-local
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/muyiwadoes/jenkins-gitops-cicd-platform.git
    targetRevision: main
    path: kubernetes
  destination:
    server: https://kubernetes.default.svc
    namespace: wanderlust
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
