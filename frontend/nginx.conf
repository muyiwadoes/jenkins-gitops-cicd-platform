# HTTP server
server {
    listen 80;
    server_name _;

    # Frontend static files
    root /usr/share/nginx/html;
    index index.html;

    # Support React Router client-side routes
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Avoid caching the HTML entry point so deployments can update cleanly
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # Do not expose hidden files
    location ~ /\. {
        deny all;
    }
}
